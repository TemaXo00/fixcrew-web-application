global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: 'blog-service'
    static_configs:
      - targets: ['blog-service:3000']

  - job_name: 'user-service'
    static_configs:
      - targets: ['user-service:3000']

  - job_name: 'order-service'
    static_configs:
      - targets: ['order-service:3000']

  - job_name: 'mail-service'
    static_configs:
      - targets: ['mail-service:3000']

  - job_name: 'file-service'
    static_configs:
      - targets: ['file-service:3000']

  - job_name: 'info-service'
    static_configs:
      - targets: ['info-service:3000']