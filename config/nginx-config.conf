events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    map $http_x_forwarded_proto $proxy_scheme {
        default $scheme;
        https https;
        http http;
    }

    upstream ui_main {
        server ui-main:5173;
    }

    upstream ui_admin {
        server ui-admin:5173;
    }

    upstream gateway {
        server gateway-service:3000;
    }

    upstream grafana {
        server grafana:3000;
    }

    upstream minio {
        server minio:9001;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name getfixcrew.com www.getfixcrew.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    server {
        listen 80;
        listen [::]:80;
        server_name admin.getfixcrew.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    server {
        listen 80;
        listen [::]:80;
        server_name api.getfixcrew.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    server {
        listen 80;
        listen [::]:80;
        server_name metrics.getfixcrew.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    server {
        listen 80;
        listen [::]:80;
        server_name storage.getfixcrew.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name getfixcrew.com www.getfixcrew.com;

        ssl_certificate /etc/nginx/ssl/live/getfixcrew.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/getfixcrew.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://ui_main;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name admin.getfixcrew.com;

        ssl_certificate /etc/nginx/ssl/live/admin.getfixcrew.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/admin.getfixcrew.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://ui_admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.getfixcrew.com;

        ssl_certificate /etc/nginx/ssl/live/api.getfixcrew.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/api.getfixcrew.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        client_max_body_size 10M;

        location / {
            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_upgrade;

            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
            proxy_cookie_domain ~^(.+)$ $host;
            proxy_cookie_path / /;
        }
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name metrics.getfixcrew.com;

        ssl_certificate /etc/nginx/ssl/live/metrics.getfixcrew.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/metrics.getfixcrew.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://grafana;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name storage.getfixcrew.com;

        ssl_certificate /etc/nginx/ssl/live/storage.getfixcrew.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/storage.getfixcrew.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://minio;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}