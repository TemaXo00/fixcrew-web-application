events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream ui_main {
        server ui-main:5173;
    }

    upstream ui_admin {
        server ui-admin:5173;
    }

    upstream gateway {
        server gateway-service:3000;
    }

    upstream grafana {
        server grafana:3000;
    }

    upstream minio {
        server minio:9001;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name app.getfixcrew.com admin.getfixcrew.com api.getfixcrew.com metrics.getfixcrew.com storage.getfixcrew.com;
        return 301 https://$host$request_uri;
    }

    # Основной сайт
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name app.getfixcrew.com;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        
        location / {
            proxy_pass http://ui_main;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Admin
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name admin.getfixcrew.com;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        
        location / {
            proxy_pass http://ui_admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # API Gateway
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name api.getfixcrew.com;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        client_max_body_size 10M;

        location / {
            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
        }
    }

    # Grafana
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name metrics.getfixcrew.com;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        
        location / {
            proxy_pass http://grafana;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # MinIO
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name storage.getfixcrew.com;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        
        location / {
            proxy_pass http://minio;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
