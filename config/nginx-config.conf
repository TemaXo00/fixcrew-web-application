events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    upstream ui_main {
        server ui-main:5173;
    }

    upstream ui_admin {
        server ui-admin:5173;
    }

    upstream gateway {
        server gateway-service:3000;
    }

    upstream grafana {
        server grafana:3000;
    }

    upstream minio {
        server minio:9001;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name getfixcrew.com www.getfixcrew.com app.getfixcrew.com
                    admin.getfixcrew.com api.getfixcrew.com
                    metrics.getfixcrew.com storage.getfixcrew.com;
        
        location ~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name app.getfixcrew.com;

        ssl_certificate /etc/letsencrypt/live/app.getfixcrew.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.getfixcrew.com/privkey.pem;
        
        location / {
            proxy_pass http://ui_main;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name admin.getfixcrew.com;

        ssl_certificate /etc/letsencrypt/live/app.getfixcrew.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.getfixcrew.com/privkey.pem;
        
        location / {
            proxy_pass http://ui_admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name api.getfixcrew.com;

        ssl_certificate /etc/letsencrypt/live/app.getfixcrew.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.getfixcrew.com/privkey.pem;

        client_max_body_size 10M;

        location / {
            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name metrics.getfixcrew.com;

        ssl_certificate /etc/letsencrypt/live/app.getfixcrew.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.getfixcrew.com/privkey.pem;
        
        location / {
            proxy_pass http://grafana;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name storage.getfixcrew.com;

        ssl_certificate /etc/letsencrypt/live/app.getfixcrew.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.getfixcrew.com/privkey.pem;
        
        location / {
            proxy_pass http://minio;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
