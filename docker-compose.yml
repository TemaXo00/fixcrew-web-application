services:
  redis:
    image: redis:8.6.1-alpine
    container_name: fixcrew-redis
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory-policy allkeys-lru
    restart: unless-stopped
    networks:
      - backend

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: fixcrew-minio
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_UI_PORT}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - storage
      - backend

  prometheus:
    image: prom/prometheus:v3.10.0
    container_name: fixcrew-prometheus
    ports:
      - "${PROM_PORT}:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - monitoring
      - backend

  loki:
    image: grafana/loki:main-d36987e
    container_name: fixcrew-loki
    ports:
      - "${LOKI_PORT}:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./config/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    restart: unless-stopped
    networks:
      - monitoring

  promtail:
    image: grafana/promtail:main-d36987e
    container_name: fixcrew-promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    networks:
      - monitoring
    depends_on:
      - loki

  grafana:
    image: grafana/grafana-oss:12.4.0
    container_name: fixcrew-grafana
    ports:
      - "${GF_PORT}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - monitoring
    depends_on:
      - prometheus
      - loki

  ui-main:
    build:
      context: .
      dockerfile: ./docker-files/UiMain.Dockerfile
      args:
        UI_MAIN_PATH: ${UI_MAIN_PATH}
    container_name: fixcrew-ui-main
    environment:
      GATEWAY_PORT: ${GATEWAY_PORT}
    ports:
      - "${UI_MAIN_PORT}:5173"
    volumes:
      - ./ui/fixcrew-main:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - frontend

  ui-admin:
    build:
      context: .
      dockerfile: ./docker-files/UiAdmin.Dockerfile
      args:
        UI_ADMIN_PATH: ${UI_ADMIN_PATH}
    container_name: fixcrew-ui-admin
    environment:
      GATEWAY_PORT: ${GATEWAY_PORT}
    ports:
      - "${UI_ADMIN_PORT}:5173"
    volumes:
      - ./ui/fixcrew-admin:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - frontend

  gateway-service:
    build:
      context: .
      dockerfile: ./docker-files/GatewayService.Dockerfile
      args:
        GATEWAY_SERVICE_PATH: ${GATEWAY_SERVICE_PATH}
    container_name: fixcrew-gateway
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    ports:
      - "${GATEWAY_SERVICE_PORT}:3000"
    volumes:
      - ./backend/gateway-service:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - backend
      - frontend

  blog-service:
    build:
      context: .
      dockerfile: ./docker-files/BlogService.Dockerfile
      args:
        BLOG_SERVICE_PATH: ${BLOG_SERVICE_PATH}
    container_name: fixcrew-blog-service
    volumes:
      - ./backend/blog-service:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - backend
      - storage
    depends_on:
      - redis

  file-service:
    build:
      context: .
      dockerfile: ./docker-files/FileService.Dockerfile
      args:
        FILE_SERVICE_PATH: ${FILE_SERVICE_PATH}
    container_name: fixcrew-file-service
    volumes:
      - ./backend/file-service:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - backend
      - storage
    depends_on:
      - redis
      - minio

  info-service:
    build:
      context: .
      dockerfile: ./docker-files/InfoService.Dockerfile
      args:
        INFO_SERVICE_PATH: ${INFO_SERVICE_PATH}
    container_name: fixcrew-info-service
    volumes:
      - ./backend/info-service:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - backend
    depends_on:
      - redis

  mail-service:
    build:
      context: .
      dockerfile: ./docker-files/MailService.Dockerfile
      args:
        MAIL_SERVICE_PATH: ${MAIL_SERVICE_PATH}
    container_name: fixcrew-mail-service
    volumes:
      - ./backend/mail-service:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - backend
    depends_on:
      - redis

  order-service:
    build:
      context: .
      dockerfile: ./docker-files/OrderService.Dockerfile
      args:
        ORDER_SERVICE_PATH: ${ORDER_SERVICE_PATH}
    container_name: fixcrew-order-service
    volumes:
      - ./backend/order-service:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - backend
    depends_on:
      - redis

  user-service:
    build:
      context: .
      dockerfile: ./docker-files/UserService.Dockerfile
      args:
        USER_SERVICE_PATH: ${USER_SERVICE_PATH}
    container_name: fixcrew-user-service
    environment:
      DATABASE_URL: ${USER_DB_URL}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_TTL: ${REDIS_TTL}
    volumes:
      - ./backend/user-service:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - backend
    depends_on:
      - redis

  user-db:
    image: postgres:18.3-alpine
    container_name: fixcrew-user_db
    environment:
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
      POSTGRES_DB: ${USER_DB_NAME}
    volumes:
      - user_data:/var/lib/postgresql/
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${USER_DB_USER} -d ${USER_DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend


networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  storage:
    driver: bridge
  monitoring:
    driver: bridge

volumes:
  redis_data:
  minio_data:
  grafana-data:
  prometheus-data:
  loki-data:

  user_data: