services:
  redis:
    image: redis:8.6.1-alpine
    container_name: fixcrew-redis
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory-policy allkeys-lru
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: fixcrew-minio
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_UI_PORT}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - storage
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.10.0
    container_name: fixcrew-prometheus
    ports:
      - "${PROM_PORT}:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - monitoring
      - backend

  loki:
    image: grafana/loki:main-d36987e
    container_name: fixcrew-loki
    ports:
      - "${LOKI_PORT}:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./config/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - monitoring

  promtail:
    image: grafana/promtail:main-d36987e
    container_name: fixcrew-promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring
    depends_on:
      - loki

  rabbitmq:
    image: rabbitmq:4.2.4-alpine
    container_name: fixcrew-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_MQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_MQ_PASSWORD}
    networks:
      - backend
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana-oss:12.4.0
    container_name: fixcrew-grafana
    ports:
      - "${GF_PORT}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - monitoring
      - backend
    depends_on:
      - prometheus
      - loki

  ui-main:
    build:
      context: .
      dockerfile: ./docker-files/UiMain.Dockerfile
      args:
        UI_MAIN_PATH: ${UI_MAIN_PATH}
    container_name: fixcrew-ui-main
    environment:
      VITE_GATEWAY_URL: ${GATEWAY_URL}
    ports:
      - "${UI_MAIN_PORT}:5173"
    volumes:
      - ./ui/fixcrew-main:/app
      - /app/node_modules
    networks:
      - frontend

  ui-admin:
    build:
      context: .
      dockerfile: ./docker-files/UiAdmin.Dockerfile
      args:
        UI_ADMIN_PATH: ${UI_ADMIN_PATH}
    container_name: fixcrew-ui-admin
    environment:
      VITE_GATEWAY_URL: ${GATEWAY_URL}
    ports:
      - "${UI_ADMIN_PORT}:5173"
    volumes:
      - ./ui/fixcrew-admin:/app
      - /app/node_modules
    networks:
      - frontend

  gateway-service:
    build:
      context: .
      dockerfile: ./docker-files/GatewayService.Dockerfile
      args:
        GATEWAY_SERVICE_PATH: ${GATEWAY_SERVICE_PATH}
    container_name: fixcrew-gateway
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    ports:
      - "${GATEWAY_SERVICE_PORT}:3000"
    volumes:
      - ./backend/gateway-service:/app
      - /app/node_modules
    networks:
      - backend
      - frontend

  user-db:
    image: postgres:18.3-alpine
    container_name: fixcrew-user-db
    environment:
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
      POSTGRES_DB: ${USER_DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - user_data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB_USER} -d ${USER_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  blog-db:
    image: postgres:18.3-alpine
    container_name: fixcrew-blog-db
    environment:
      POSTGRES_USER: ${BLOG_DB_USER}
      POSTGRES_PASSWORD: ${BLOG_DB_PASSWORD}
      POSTGRES_DB: ${BLOG_DB_NAME}
    ports:
      - "5434:5432"
    volumes:
      - blog_data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BLOG_DB_USER} -d ${BLOG_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  info-db:
    image: postgres:18.3-alpine
    container_name: fixcrew-info-db
    environment:
      POSTGRES_USER: ${INFO_DB_USER}
      POSTGRES_PASSWORD: ${INFO_DB_PASSWORD}
      POSTGRES_DB: ${INFO_DB_NAME}
    ports:
      - "5435:5432"
    volumes:
      - info_data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INFO_DB_USER} -d ${INFO_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  order-db:
    image: postgres:18.3-alpine
    container_name: fixcrew-order-db
    environment:
      POSTGRES_USER: ${ORDER_DB_USER}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD}
      POSTGRES_DB: ${ORDER_DB_NAME}
    ports:
      - "5436:5432"
    volumes:
      - order_data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORDER_DB_USER} -d ${ORDER_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  file-db:
    image: postgres:18.3-alpine
    container_name: fixcrew-file-db
    environment:
      POSTGRES_USER: ${FILE_DB_USER}
      POSTGRES_PASSWORD: ${FILE_DB_PASSWORD}
      POSTGRES_DB: ${FILE_DB_NAME}
    ports:
      - "5437:5432"
    volumes:
      - file_data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FILE_DB_USER} -d ${FILE_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  blog-service:
    build:
      context: .
      dockerfile: ./docker-files/BlogService.Dockerfile
      args:
        BLOG_SERVICE_PATH: ${BLOG_SERVICE_PATH}
    container_name: fixcrew-blog-service
    environment:
      DATABASE_URL: ${BLOG_DB_URL}
      REDIS_URL: ${REDIS_URL}
    volumes:
      - ./backend/blog-service:/app
      - /app/node_modules
    networks:
      - backend
      - storage
    depends_on:
      redis:
        condition: service_healthy
      blog-db:
        condition: service_healthy

  file-service:
    build:
      context: .
      dockerfile: ./docker-files/FileService.Dockerfile
      args:
        FILE_SERVICE_PATH: ${FILE_SERVICE_PATH}
    container_name: fixcrew-file-service
    environment:
      DATABASE_URL: ${FILE_DB_URL}
      GATEWAY_URL: ${GATEWAY_URL}
      MINIO_USER: ${MINIO_USER}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - ./backend/file-service:/app
      - /app/node_modules
    networks:
      - backend
      - storage
    depends_on:
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      file-db:
        condition: service_healthy

  info-service:
    build:
      context: .
      dockerfile: ./docker-files/InfoService.Dockerfile
      args:
        INFO_SERVICE_PATH: ${INFO_SERVICE_PATH}
    container_name: fixcrew-info-service
    environment:
      DATABASE_URL: ${INFO_DB_URL}
      REDIS_URL: ${REDIS_URL}
      RABBIT_MQ_USER: ${RABBIT_MQ_USER}
      RABBIT_MQ_PASSWORD: ${RABBIT_MQ_PASSWORD}
      ORDER_QUEUE: ${ORDER_QUEUE}
    volumes:
      - ./backend/info-service:/app
      - /app/node_modules
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy
      info-db:
        condition: service_healthy

  mail-service:
    build:
      context: .
      dockerfile: ./docker-files/MailService.Dockerfile
      args:
        MAIL_SERVICE_PATH: ${MAIL_SERVICE_PATH}
    container_name: fixcrew-mail-service
    environment:
      MAIL_USER: ${MAIL_USER}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_UI_LINK: ${MAIL_UI_LINK}
      RABBIT_MQ_USER: ${RABBIT_MQ_USER}
      RABBIT_MQ_PASSWORD: ${RABBIT_MQ_PASSWORD}
      MAIL_QUEUE: ${MAIL_QUEUE}
    volumes:
      - ./backend/mail-service:/app
      - /app/node_modules
    networks:
      - backend
    depends_on:
      rabbitmq:
        condition: service_healthy

  order-service:
    build:
      context: .
      dockerfile: ./docker-files/OrderService.Dockerfile
      args:
        ORDER_SERVICE_PATH: ${ORDER_SERVICE_PATH}
    container_name: fixcrew-order-service
    environment:
      DATABASE_URL: ${ORDER_DB_URL}
      REDIS_URL: ${REDIS_URL}
      RABBIT_MQ_USER: ${RABBIT_MQ_USER}
      RABBIT_MQ_PASSWORD: ${RABBIT_MQ_PASSWORD}
      ORDER_QUEUE: ${ORDER_QUEUE}
      INFO_QUEUE: ${INFO_QUEUE}
      MAIL_QUEUE: ${MAIL_QUEUE}
    volumes:
      - ./backend/order-service:/app
      - /app/node_modules
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      order-db:
        condition: service_healthy

  user-service:
    build:
      context: .
      dockerfile: ./docker-files/UserService.Dockerfile
      args:
        USER_SERVICE_PATH: ${USER_SERVICE_PATH}
    container_name: fixcrew-user-service
    environment:
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      DATABASE_URL: ${USER_DB_URL}
      RABBIT_MQ_USER: ${RABBIT_MQ_USER}
      RABBIT_MQ_PASSWORD: ${RABBIT_MQ_PASSWORD}
      MAIL_QUEUE: ${MAIL_QUEUE}
      ORDER_QUEUE: ${ORDER_QUEUE}
    volumes:
      - ./backend/user-service:/app
      - /app/node_modules
    networks:
      - backend
    depends_on:
      rabbitmq:
        condition: service_healthy
      user-db:
        condition: service_healthy

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  storage:
    driver: bridge
  monitoring:
    driver: bridge

volumes:
  redis_data:
  minio_data:
  grafana-data:
  prometheus-data:
  loki-data:
  user_data:
  blog_data:
  info_data:
  order_data:
  file_data: