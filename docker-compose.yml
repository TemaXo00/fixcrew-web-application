services:
  redis:
    image: redis:8.6.1-alpine
    container_name: fixcrew-redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - backend

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: fixcrew-minio
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_UI_PORT}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - storage
      - backend

  grafana:
    image: grafana/grafana-oss:12.4.0
    container_name: fixcrew-grafana
    ports:
      - "${GF_PORT}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - monitoring
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.10.0
    container_name: fixcrew-prometheus
    ports:
      - "${PROM_PORT}:9090"
    env_file:
      - .env
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - monitoring
    restart: unless-stopped

  loki:
    image: grafana/loki:main-d36987e
    container_name: fixcrew-loki
    ports:
      - "${LOKI_PORT}:3100"
    env_file:
      - .env
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./config/loki-config.yml:/etc/loki/loki-config.yml
      - loki-data:/loki
    networks:
      - monitoring
    restart: unless-stopped

  promtail:
    image: grafana/promtail:main-d36987e
    container_name: fixcrew-promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring
    restart: unless-stopped

  ui-main:
    build:
      context: .
      dockerfile: ./docker-files/UiMain.Dockerfile
      args:
        UI_MAIN_PATH: ${UI_MAIN_PATH}
    container_name: fixcrew-ui-main
    ports:
      - "${UI_MAIN_PORT}:5173"
    volumes:
      - ./ui/fixcrew-main:/app/
      - /app/node_modules
    restart: unless-stopped
    networks:
      - frontend
      - backend

  ui-admin:
    build:
      context: .
      dockerfile: ./docker-files/UiAdmin.Dockerfile
      args:
        UI_ADMIN_PATH: ${UI_ADMIN_PATH}
    container_name: fixcrew-ui-admin
    ports:
      - "${UI_ADMIN_PORT}:5173"
    volumes:
      - ./ui/fixcrew-admin:/app/
      - /app/node_modules
    restart: unless-stopped
    networks:
      - frontend
      - backend

  api_gateway:
    build:
      context: .
      dockerfile: ./docker-files/ServicesGateaway.Dockerfile
      args:
        GATEWAY_PATH: ${GATEWAY_PATH}
    container_name: fixcrew-gateway
    ports:
      - "${GATEWAY_PORT}:3000"
    volumes:
      - ./backend/gateway:/app/
      - /app/node_modules
    restart: unless-stopped
    networks:
      - backend

  file-service:
    build:
      context: .
      dockerfile: ./docker-files/FileService.Dockerfile
      args:
        FILE_SERVICE_PATH: ${FILE_SERVICE_PATH}
    container_name: fixcrew-file-service
    ports:
      - "${FILE_SERVICE_PORT}:3000"
    volumes:
      - ./backend/file-service:/app/
      - /app/node_modules
    restart: unless-stopped
    networks:
      - backend
      - storage

networks:
  frontend:
  backend:
  storage:
  monitoring:

volumes:
  redis_data:
  minio_data:
  grafana-data:
  prometheus-data:
  loki-data: